steps:
  - id: getEnv
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: sh
    args:
    - '-c'
    - |
      gcloud secrets versions access latest --secret="AGENT_SECRETS_DEV" > .env

  - id: build
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker pull europe-west1-docker.pkg.dev/pigen-463612/ckeeper-repo/devops-agent:latest || exit 0
        docker compose -f docker-compose-dev.yml build --cache-from europe-west1-docker.pkg.dev/pigen-463612/ckeeper-repo/devops-agent:latest
        docker tag europe-west1-docker.pkg.dev/pigen-463612/ckeeper-repo/devops-agent:latest europe-west1-docker.pkg.dev/pigen-463612/ckeeper-repo/devops-agent:${SHORT_SHA}
        docker push europe-west1-docker.pkg.dev/pigen-463612/ckeeper-repo/devops-agent:${SHORT_SHA}
        docker push europe-west1-docker.pkg.dev/pigen-463612/ckeeper-repo/devops-agent:latest
  - id: deploy
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: sh
    args:
      - "-c"
      - |
        echo "***************************"
        echo "DEPLOYING TO ckeeper-agent-dev"
        echo "***************************"
        gcloud run services update ckeeper-agent-dev \
          --region=${LOCATION} \
          --image=europe-west1-docker.pkg.dev/pigen-463612/ckeeper-repo/devops-agent:latest

options:
  logging: CLOUD_LOGGING_ONLY