
steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/PROJECT_ID/devops-agent-repo/devops-agent-image:$SHORT_SHA",
        ".",
      ]
    id: build-image

  # Push the Docker image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/PROJECT_ID/devops-agent-repo/devops-agent-image:$SHORT_SHA",
      ]
    id: push-image

  # Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "devops-agent-dev",
        "--image",
        "us-central1-docker.pkg.dev/PROJECT_ID/devops-agent-repo/devops-agent-image:$SHORT_SHA",
        "--region",
        "us-central1",
        "--platform",
        "managed",
        "--quiet",
        "--secrets",
        "devops-agent-secret=devops-agent-secret:latest",
      ]
    id: deploy

# Store images in Artifact Registry
images:
  - "us-central1-docker.pkg.dev/PROJECT_ID/devops-agent-repo/devops-agent-image:$SHORT_SHA"

options:
  substitution_option: "ALLOW_LOOSE"
substitutions:
  _SERVICE_NAME: "devops-agent-dev"
