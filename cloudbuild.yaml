# This is a dummy change to trigger a pull request for reporting purposes.
steps:  - id: getEnv
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: sh
    args:
    - '-c'
    - |
      gcloud secrets versions access latest --secret="devops-agent-secret" > .env

  - id: build
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker compose -f docker-compose-dev.yml build
        docker tag europe-west1-docker.pkg.dev/pigen-463612/devops-agent-artifact/devops-agent:latest europe-west1-docker.pkg.dev/pigen-463612/devops-agent-artifact/devops-agent:${SHORT_SHA}
        docker push europe-west1-docker.pkg.dev/pigen-463612/devops-agent-artifact/devops-agent:${SHORT_SHA}
        docker push europe-west1-docker.pkg.dev/pigen-463612/devops-agent-artifact/devops-agent:latest
  - id: deploy
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: sh
    args:
      - "-c"
      - |
        echo "***************************"
        echo "DEPLOYING TO devops-agent"
        echo "***************************"
        gcloud run services update devops-agent-app \
          --region=${LOCATION} \
          --image=europe-west1-docker.pkg.dev/pigen-463612/devops-agent-artifact/devops-agent:latest

options:
  logging: CLOUD_LOGGING_ONLY
